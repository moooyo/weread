[package]
name = "weread-offline-ui-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-fontique-010"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
weread = { path = "../.." }

[patch.crates-io]
i-slint-core = { path = "../../vendor/i-slint-core" }
swash = { path = "../../vendor/swash" }
zeno = { path = "../../vendor/zeno" }

[profile.dev]
debug = 0
incremental = true

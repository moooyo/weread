[package]
name = "weread"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Independent e-ink reading client with a Rust application core and Slint interface"
publish = false

[workspace]
members = ["vendor/swash"]
default-members = ["."]
exclude = ["vendor/i-slint-core", "vendor/slint-backend-kindle", "vendor/zip", "vendor/zeno"]
resolver = "3"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-software"]
kindle = ["dep:slint-backend-kindle"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
owned_ttf_parser = "0.25"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
md5 = "0.7"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "deflate"] }
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "unstable-fontique-010"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
url = "2"
zip = { version = "=4.6.1", path = "vendor/zip", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
slint-backend-kindle = { path = "vendor/slint-backend-kindle", optional = true }

[build-dependencies]
serde_json = "1"
slint-build = "=1.17.1"

[dev-dependencies]
tempfile = "3"
swash = { version = "=0.2.10", default-features = false }
skrifa = { version = "=0.44.0", default-features = false }
skrifa_0421 = { package = "skrifa", version = "=0.42.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = true

[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
swash = { path = "vendor/swash" }
zeno = { path = "vendor/zeno" }
